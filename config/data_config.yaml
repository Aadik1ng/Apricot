# Dataset configuration for spill detection

# Dataset paths (will be updated with absolute paths at runtime)
train: datasets/train
val: datasets/valid
test: datasets/test

# Class information
nc: 1
names: ['Spill']

# Preprocessing settings
preprocessing:
  image_size: 640
  augmentation: True
  
  # Data augmentation settings
  augmentation_settings:
    flip_horizontal: True
    flip_vertical: False
    brightness_adjustment: True
    contrast_adjustment: True
    
# Dataset statistics (example values, will be populated during dataset analysis)
statistics:
  train:
    images: 0
    labels: 0
    instances_per_image: 0
  valid:
    images: 0
    labels: 0
    instances_per_image: 0
  test:
    images: 0
    labels: 0
    instances_per_image: 0 